# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_campaign_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.application.name=whatsapp-campaign-management

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-secret-at-least-32-characters}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

whatsapp.provider=fake
whatsapp.enabled=false
whatsapp.base-url=
whatsapp.phone-number-id=
whatsapp.access-token=

logging.config=classpath:logback-spring.xml